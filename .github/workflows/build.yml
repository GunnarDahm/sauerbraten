name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux client (SDL2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev zlib1g-dev libgl-dev
      - name: Build
        run: make -C src -j"$(nproc)" client server

  android:
    name: Android APK
    runs-on: ubuntu-24.04
    permissions:
      contents: write # publish the android-latest release
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/master' }} # never interrupt a release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch third-party sources
        run: android/fetch-deps.sh

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sauerbraten-android
          path: android/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
          retention-days: 30

      # master builds replace the android-latest prerelease, so there is a stable link that
      # downloads the APK directly (Actions artifacts can't be downloaded in the GitHub app)
      - name: Publish android-latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk sauerbraten-android.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest sauerbraten-android.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Latest Android build" \
            --notes "Test build of master at ${GITHUB_SHA::7}, rebuilt on every push to master. Requires Android 7.0+; signed with a debug key for sideloading. See android/README.md for install and controller details."
