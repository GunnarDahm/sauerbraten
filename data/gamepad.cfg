// default game controller bindings, loaded before your saved config so your own binds win
// don't modify, use "bind" in autoexec.cfg instead
//
// left stick moves, right stick looks around; while a menu is open the sticks move the
// cursor, A clicks and B backs out (set padmenubuttons 0 to use your own binds there)
// tweak with: paddeadzone, padyawspeed, padpitchspeed, padlookcurve, padinvert, padcursorspeed

bind PAD_RT "attack"
bind PAD_LT [ zoom 1; onrelease [ zoom -1 ] ]
bind PAD_A "jump"
bind PAD_LSTICK "jump"
bind PAD_RB [ universaldelta 1 ]
bind PAD_LB [ universaldelta -1 ]
bind PAD_X "weapon"
bind PAD_Y "showscores"
bind PAD_BACK "showscores"
bind PAD_START [togglemainmenu]
bind PAD_RSTICK [ togglezoom ]
bind PAD_UP "setweapon RL"
bind PAD_DOWN "setweapon SG"
bind PAD_LEFT "setweapon CG"
bind PAD_RIGHT "setweapon RI"
bind PAD_B "dropflag"

specbind PAD_RT "nextfollow"
specbind PAD_LT "nextfollow -1"
specbind PAD_A "follow"
